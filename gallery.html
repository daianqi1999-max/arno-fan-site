<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARNO的画廊 | JIAHAO 张家豪</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0f1419;
            --secondary-bg: #1a1f2e;
            --accent-blue: #6b8cae;
            --accent-light: #a8c4d9;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b8c8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 全局视频背景 */
        .global-video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s ease;
            background: transparent;
        }
        nav.scrolled {
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.8rem 5%;
        }
        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 0; height: 1px;
            background: var(--accent-light);
            transition: width 0.3s ease;
        }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a:hover::after { width: 100%; }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* 头部区域 */
        .page-header {
            padding: 10rem 5% 3rem;
            text-align: center;
            position: relative;
        }
        .page-tag {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            color: var(--accent-blue);
            letter-spacing: 3px;
            margin-bottom: 0.8rem;
            display: block;
        }
        .page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .page-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
        }

        /* 画廊网格 */
        .gallery-container {
            max-width: 1200px;
            width: 94%;
            margin: 0 auto 4rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
        }
        .gallery-card {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(40px);
        }
        .gallery-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .gallery-card:hover {
            transform: translateY(-6px);
            border-color: rgba(107, 140, 174, 0.4);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
            display: block;
        }
        .gallery-card:hover img {
            transform: scale(1.08);
        }
        .gallery-card-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-card:hover .gallery-card-overlay {
            opacity: 1;
        }
        .gallery-card-overlay i {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.9);
            transition: transform 0.3s ease;
        }
        .gallery-card:hover .gallery-card-overlay i {
            transform: scale(1.15);
        }

        /* ===== Lightbox 图片放大 ===== */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 8px;
            transform: scale(0.92);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .lightbox-overlay.active .lightbox-img {
            transform: scale(1);
        }
        .lightbox-close {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10000;
        }
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }
        .lightbox-caption {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease 0.1s;
        }
        .lightbox-overlay.active .lightbox-caption {
            opacity: 1;
        }

        /* 底部操作栏 */
        .action-bar {
            text-align: center;
            padding: 0 5% 5rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            color: var(--accent-light);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(107, 140, 174, 0.2);
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(107, 140, 174, 0.2);
            color: var(--text-primary);
        }

        /* Footer */
        footer {
            background: rgba(15, 20, 30, 0.55);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            border-top: 1px solid rgba(255,255,255,0.12);
            padding: 3rem 5%;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .footer-logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%; left: 0;
                width: 100%;
                background: rgba(15, 20, 30, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                border-bottom: 1px solid var(--glass-border);
            }
            .nav-links.active { display: flex; }
            .mobile-menu-btn { display: block; }
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }
        @media (max-width: 600px) {
            .gallery-container {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--accent-blue);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 全局视频背景 -->
    <video class="global-video-bg" autoplay muted loop playsinline>
        <source src="bg1.mp4" type="video/mp4">
    </video>

    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 导航 -->
    <nav id="navbar">
        <a href="index.html" class="logo">JIAHAO</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#home">首页</a></li>
            <li><a href="index.html#profile">个人信息</a></li>
            <li><a href="index.html#stage">安利舞台</a></li>
            <li><a href="index.html#gallery">ARNO的画廊</a></li>
            <li><a href="index.html#news">最新资讯</a></li>
            <li><a href="index.html#guestbook">粉丝留言</a></li>
        </ul>
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 页面标题 -->
    <section class="page-header">
        <span class="page-tag">GALLERY</span>
        <h1 class="page-title">ARNO的画廊</h1>
        <p class="page-desc">每一幅画，都是关于他的独家记忆</p>
    </section>

    <!-- 全部图片 -->
    <div class="gallery-container" id="galleryContainer">
        <div class="gallery-card">
            <img src="images/1.jpg" alt="Gallery 1" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/2.jpg" alt="Gallery 2" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/3.jpg" alt="Gallery 3" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/4.jpg" alt="Gallery 4" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/5.jpg" alt="Gallery 5" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/6.jpg" alt="Gallery 6" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/7.jpg" alt="Gallery 7" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/8.jpg" alt="Gallery 8" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
        <div class="gallery-card">
            <img src="images/9.jpg" alt="Gallery 9" loading="lazy">
            <div class="gallery-card-overlay"><i class="fas fa-image"></i></div>
        </div>
    </div>

    <!-- 底部操作 -->
    <div class="action-bar">
        <a href="index.html#gallery" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回主页
        </a>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-logo">JIAHAO</div>
        <p> ZHANGJIAHAO Fan Support Site · 应援站</p>
        <p style="margin-top: 0.5rem; opacity: 0.6;">Made with <i class="fas fa-heart" style="color: var(--accent-blue);"></i> by Fans</p>
    </footer>

    <script>
        // 导航栏滚动效果
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });

        // 移动端菜单
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('active'));
        });

        // 粒子效果
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        // Intersection Observer 滚动动画
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);
        document.querySelectorAll('.gallery-card').forEach(el => {
            observer.observe(el);
        });

        // ==================== Lightbox 图片放大 ====================
        const lightboxOverlay = document.createElement('div');
        lightboxOverlay.className = 'lightbox-overlay';
        lightboxOverlay.innerHTML = `
            <div class="lightbox-close"><i class="fas fa-times"></i></div>
            <img class="lightbox-img" src="" alt="">
            <div class="lightbox-caption"></div>
        `;
        document.body.appendChild(lightboxOverlay);

        const lbImg = lightboxOverlay.querySelector('.lightbox-img');
        const lbClose = lightboxOverlay.querySelector('.lightbox-close');
        const lbCaption = lightboxOverlay.querySelector('.lightbox-caption');

        function openLightbox(src, alt) {
            lbImg.src = src;
            lbCaption.textContent = alt || '';
            lightboxOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lightboxOverlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { lbImg.src = ''; }, 350);
        }

        document.querySelectorAll('.gallery-card').forEach(card => {
            card.style.cursor = 'pointer';
            card.addEventListener('click', () => {
                const img = card.querySelector('img');
                if (img) openLightbox(img.src, img.alt);
            });
        });

        lbClose.addEventListener('click', closeLightbox);
        lightboxOverlay.addEventListener('click', (e) => {
            if (e.target === lightboxOverlay) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
