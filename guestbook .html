<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粉丝留言墙 | JIAHAO 张家豪</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0f1419;
            --secondary-bg: #1a1f2e;
            --accent-blue: #6b8cae;
            --accent-light: #a8c4d9;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b8c8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 全局视频背景 */
        .global-video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s ease;
            background: transparent;
        }
        nav.scrolled {
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.8rem 5%;
        }
        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 0; height: 1px;
            background: var(--accent-light);
            transition: width 0.3s ease;
        }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a:hover::after { width: 100%; }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* 头部区域 */
        .page-header {
            padding: 10rem 5% 3rem;
            text-align: center;
            position: relative;
        }
        .page-tag {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            color: var(--accent-blue);
            letter-spacing: 3px;
            margin-bottom: 0.8rem;
            display: block;
        }
        .page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .page-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
        }

        /* ==================== 留言板蒙版区域 ==================== */
        .guestbook-board {
            max-width: 1200px;
            width: 94%;
            margin: 0 auto 3rem;
            min-height: 680px;
            padding: 3rem 0;
            background: rgba(180, 190, 205, 0.07);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 20px 60px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.2rem;
        }
        .guestbook-board::before {
            content: '';
            position: absolute;
            top: -30%; left: -20%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(107, 140, 174, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .guestbook-board::after {
            content: '';
            position: absolute;
            bottom: -30%; right: -20%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(168, 196, 217, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 轨道 */
        .marquee-row {
            position: relative;
            width: 100%;
            height: 52px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 弹幕气泡 */
        .msg-bubble {
            position: absolute;
            top: 50%;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 0.7rem 1.6rem;
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.92rem;
            will-change: left, transform;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .msg-bubble i {
            color: var(--accent-blue);
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .msg-author {
            color: var(--accent-light);
            font-weight: 600;
        }
        .msg-content {
            color: #c8d0dc;
        }

        /* 从左到右：完全从左侧外滑到右侧外 */
        @keyframes slideLTR {
            0%   { left: 0; transform: translate(-150%, -50%); }
            100% { left: 100%; transform: translate(0, -50%); }
        }
        /* 从右到左：完全从右侧外滑到左侧外 */
        @keyframes slideRTL {
            0%   { left: 100%; transform: translate(0, -50%); }
            100% { left: 0; transform: translate(-150%, -50%); }
        }

        /* 空状态 */
        .empty-wall {
            text-align: center;
            padding: 10rem 2rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }
        .empty-wall i {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            color: var(--accent-blue);
            opacity: 0.4;
        }
        .empty-wall h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* 底部操作栏 */
        .action-bar {
            text-align: center;
            padding: 0 5% 5rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(107, 140, 174, 0.4);
            border-radius: 30px;
            color: var(--accent-light);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(107, 140, 174, 0.2);
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(107, 140, 174, 0.2);
            color: var(--text-primary);
        }

        /* Footer */
        footer {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 3rem 5%;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .footer-logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%; left: 0;
                width: 100%;
                background: rgba(15, 20, 30, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                border-bottom: 1px solid var(--glass-border);
            }
            .nav-links.active { display: flex; }
            .mobile-menu-btn { display: block; }
            .guestbook-board {
                width: 96%;
                min-height: 520px;
                padding: 2rem 0;
                gap: 1rem;
            }
            .marquee-row { height: 48px; }
            .msg-bubble { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--accent-blue);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 全局视频背景 -->
    <video class="global-video-bg" autoplay muted loop playsinline>
        <source src="bg1.mp4" type="video/mp4">
    </video>

    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 导航 -->
    <nav id="navbar">
        <a href="index.html" class="logo">JIAHAO</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#home">首页</a></li>
            <li><a href="index.html#profile">个人信息</a></li>
            <li><a href="stage.html">舞台安利</a></li>
            <li><a href="index.html#news">最新资讯</a></li>
            <li><a href="index.html#guestbook">粉丝留言</a></li>
        </ul>
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 页面标题 -->
    <section class="page-header">
        <span class="page-tag">GUESTBOOK WALL</span>
        <h1 class="page-title">粉丝留言墙</h1>
        <p class="page-desc">每一条留言，都是一份穿越屏幕的心意</p>
    </section>

    <!-- 留言板蒙版区域 -->
    <div class="guestbook-board" id="guestbookBoard">
        <!-- JS 动态填充 -->
    </div>

    <!-- 底部操作 -->
    <div class="action-bar">
        <a href="index.html#guestbook" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回主页留言板
        </a>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-logo">JIAHAO</div>
        <p> ZHANGJIAHAO Fan Support Site · 应援站</p>
        <p style="margin-top: 0.5rem; opacity: 0.6;">Made with <i class="fas fa-heart" style="color: var(--accent-blue);"></i> by Fans</p>
    </footer>

    <script>
        // 导航栏滚动效果
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });

        // 移动端菜单
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('active'));
        });

        // 粒子效果
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        // ==================== 留言墙 API（Cloudflare Workers） ====================
        const API_URL = 'https://api.arno0707.xyz';
        const board = document.getElementById('guestbookBoard');
        const TOTAL_ROWS = 8;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function renderWall() {
            try {
                const res = await fetch(API_URL + '/api/messages');
                const messages = await res.json();

                if (!messages || messages.length === 0) {
                    board.innerHTML = `
                        <div class="empty-wall">
                            <i class="far fa-comment-dots"></i>
                            <h3>还没有留言</h3>
                            <p>快去主页留言板写下第一条留言吧！</p>
                        </div>
                    `;
                    return;
                }

                board.innerHTML = '';

                // 先创建 8 个空轨道
                const rows = [];
                for (let r = 0; r < TOTAL_ROWS; r++) {
                    const row = document.createElement('div');
                    row.className = 'marquee-row';
                    board.appendChild(row);
                    rows.push(row);
                }

                // 每条留言只创建一个气泡，均匀分配到 8 行
                messages.forEach((msg, index) => {
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.innerHTML = `
                        <i class="fas fa-heart"></i>
                        <span class="msg-author">${escapeHtml(msg.author)}：</span>
                        <span class="msg-content">${escapeHtml(msg.content)}</span>
                    `;

                    const rowIndex = index % TOTAL_ROWS;
                    const targetRow = rows[rowIndex];
                    const isLTR = rowIndex % 2 === 0;
                    const animName = isLTR ? 'slideLTR' : 'slideRTL';
                    const duration = 20 + Math.random() * 15;
                    const delay = -(Math.random() * duration * 2.5);

                    bubble.style.animation = `${animName} ${duration}s linear infinite`;
                    bubble.style.animationDelay = `${delay}s`;

                    targetRow.appendChild(bubble);
                });
            } catch (e) {
                board.innerHTML = `
                    <div class="empty-wall">
                        <i class="far fa-comment-dots"></i>
                        <h3>加载失败</h3>
                        <p>请检查网络连接后刷新页面</p>
                    </div>
                `;
            }
        }

        renderWall();

        // 页面可见性变化时暂停/恢复动画
        document.addEventListener('visibilitychange', () => {
            const bubbles = document.querySelectorAll('.msg-bubble');
            bubbles.forEach(b => {
                b.style.animationPlayState = document.hidden ? 'paused' : 'running';
            });
        });
    </script>
</body>
</html>
